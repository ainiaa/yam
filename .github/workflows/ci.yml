name: Desktop checks
on: [push, pull_request]
jobs:
  desktop:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: app
            bundle_dir: macos/YAM-macos.zip
          - os: ubuntu-22.04
            bundle: deb
            bundle_dir: deb
          - os: windows-latest
            bundle: nsis
            bundle_dir: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Linux desktop prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: pnpm build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Verify macOS release workflow without signing or uploading
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s ../../scripts -p test_macos_release.py
      - name: Package desktop application
        run: pnpm tauri build --debug --bundles ${{ matrix.bundle }}
      - name: Sign and archive macOS test package
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - --identifier com.yam.desktop src-tauri/target/debug/bundle/macos/YAM.app
          ditto -c -k --sequesterRsrc --keepParent src-tauri/target/debug/bundle/macos/YAM.app src-tauri/target/debug/bundle/macos/YAM-macos.zip
      - name: Save desktop test package
        uses: actions/upload-artifact@v4
        with:
          name: yam-test-package-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/debug/bundle/${{ matrix.bundle_dir }}
          if-no-files-found: error
          retention-days: 7
